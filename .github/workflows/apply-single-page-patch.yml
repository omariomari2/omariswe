name: Apply single-page portfolio patch

on:
  push:
    branches:
      - agent/single-page-portfolio

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-page-portfolio
      - name: Apply patch
        run: python .github/scripts/patch_single_page.py
      - name: Verify structure
        run: node tests/single-page-portfolio-check.mjs
      - name: Commit patched page
        run: |
          rm .github/scripts/patch_single_page.py .github/workflows/apply-single-page-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/single-page-portfolio-check.mjs .github
          git diff --cached --quiet && exit 0
          git commit -m "fix mobile work tabs and modal"
          git push
